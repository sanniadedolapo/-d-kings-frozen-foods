spring.application.name=dkings-frozen-foods-api
server.port=${SERVER_PORT:8080}

# Default datasource for local development and automated tests
spring.datasource.url=${DB_URL:jdbc:h2:mem:dkings_frozen_foods;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Store settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.store.name=D Kings Frozen Foods
app.store.whatsapp-number=${WHATSAPP_NUMBER:+2348000000000}
app.store.currency-symbol=₦
app.store.delivery-fee=1500.00
