# MySQL Production / Docker Configuration
# Activate by running with: -Dspring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dkings_frozen_foods?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:dkings}
spring.datasource.password=${DB_PASSWORD:dkings_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
