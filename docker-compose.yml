services:
  mysql:
    image: mysql:8.4
    container_name: dkings-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dkings_frozen_foods
      MYSQL_USER: dkings
      MYSQL_PASSWORD: dkings_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - dkings_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dkings_mysql_data:
