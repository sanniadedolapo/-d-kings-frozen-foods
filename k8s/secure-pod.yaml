apiVersion: v1
kind: Pod
metadata:
  name: secure-app-pod
  labels:
    app: dkings-frozen-foods
spec:
  serviceAccountName: app-service-account
  automountServiceAccountToken: false
  containers:
    - name: secure-web
      image: nginxinc/nginx-unprivileged:stable-alpine
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
