apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: dkings-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dkings-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dkings-mysql
  template:
    metadata:
      labels:
        app: dkings-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: dkings_frozen_foods
            - name: MYSQL_USER
              value: dkings
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dkings-db-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dkings-db-secret
                  key: root-password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}
